<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>PDF Reader — TaichiKB</title>
<link rel="icon" href="/assets/images/taiji-logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #1e1e24;
  --bg-toolbar: #141418;
  --bg-canvas: #2b2b36;
  --text-light: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #d97706;
  --accent-hover: #b45309;
  --border-color: #27272a;
  --page-shadow: 0 4px 20px rgba(0,0,0,0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-canvas);
  color: var(--text-light);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#app-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

/* Toolbar */
#toolbar {
  height: 52px;
  min-height: 52px;
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  gap: 0.75rem;
  z-index: 100;
  user-select: none;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.book-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 280px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.book-title svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.tool-btn {
  background: #27272a;
  color: var(--text-light);
  border: 1px solid #3f3f46;
  border-radius: 6px;
  padding: 0.35rem 0.65rem;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  transition: all 0.15s ease;
  height: 32px;
}

.tool-btn:hover:not(:disabled) {
  background: #3f3f46;
  border-color: #52525b;
}

.tool-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.tool-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.tool-btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.tool-btn.active {
  background: #3b82f6;
  border-color: #2563eb;
  color: #fff;
}

.page-nav {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.page-input {
  width: 48px;
  height: 30px;
  background: #18181b;
  border: 1px solid #3f3f46;
  color: var(--text-light);
  border-radius: 5px;
  text-align: center;
  font-size: 0.88rem;
  font-weight: 600;
}

.page-input:focus {
  outline: none;
  border-color: var(--accent);
}

.zoom-select {
  height: 32px;
  background: #27272a;
  border: 1px solid #3f3f46;
  color: var(--text-light);
  border-radius: 6px;
  padding: 0 0.5rem;
  font-size: 0.85rem;
  cursor: pointer;
}

.zoom-select:focus {
  outline: none;
  border-color: var(--accent);
}

/* Viewer Scroll Area */
#viewer-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1.5rem 1rem;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* Page Card Container */
.pdf-page-card {
  margin-bottom: 1.5rem;
  position: relative;
  background: #ffffff;
  box-shadow: var(--page-shadow);
  border-radius: 4px;
  overflow: hidden;
  transition: min-height 0.2s;
}

.pdf-page-card canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.page-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(24, 24, 27, 0.75);
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  pointer-events: none;
  user-select: none;
}

.page-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #71717a;
  font-size: 0.9rem;
  background: #202026;
  border: 1px dashed #3f3f46;
  border-radius: 4px;
}

/* Loading & Error Screens */
#loading-overlay {
  position: absolute;
  inset: 0;
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  z-index: 50;
  transition: opacity 0.25s ease;
}

.spinner {
  width: 44px;
  height: 44px;
  border: 4px solid #3f3f46;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.progress-bar-container {
  width: 240px;
  height: 6px;
  background: #27272a;
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.15s ease;
}

#error-overlay {
  position: absolute;
  inset: 0;
  background: var(--bg-canvas);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
  z-index: 60;
  gap: 1rem;
}

#error-overlay h3 {
  color: #ef4444;
  font-size: 1.25rem;
}

#error-overlay p {
  color: var(--text-muted);
  max-width: 500px;
  line-height: 1.5;
}

/* Responsive */
@media (max-width: 768px) {
  #toolbar {
    padding: 0 0.5rem;
    gap: 0.35rem;
  }
  .book-title {
    max-width: 140px;
    font-size: 0.95rem;
  }
  .hide-sm {
    display: none !important;
  }
  .page-input {
    width: 38px;
  }
  #viewer-container {
    padding: 0.75rem 0.25rem;
  }
}
</style>
</head>
<body>

<div id="app-container">
  <!-- Top Navigation Toolbar -->
  <header id="toolbar">
    <div class="toolbar-group">
      <div class="book-title" id="book-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="98" fill="#ffffff" stroke="#000000" stroke-width="4"/>
          <path d="M 100,2 A 98,98 0 0,1 100,198 A 49,49 0 0,1 100,100 A 49,49 0 0,0 100,2 Z" fill="#000000"/>
          <circle cx="100" cy="51" r="12" fill="#ffffff"/>
          <circle cx="100" cy="149" r="12" fill="#000000"/>
        </svg>
        <span id="title-text">Đang mở tài liệu...</span>
      </div>
    </div>

    <!-- Page Controls -->
    <div class="toolbar-group">
      <button class="tool-btn" id="btn-prev" title="Trang trước (Phím Mũi tên trái)">◀</button>
      <div class="page-nav">
        <input type="number" id="page-num" class="page-input" value="1" min="1">
        <span>/</span>
        <span id="page-count">--</span>
      </div>
      <button class="tool-btn" id="btn-next" title="Trang sau (Phím Mũi tên phải)">▶</button>
    </div>

    <!-- Zoom & Layout Controls -->
    <div class="toolbar-group">
      <button class="tool-btn hide-sm" id="btn-zoom-out" title="Thu nhỏ (-)">−</button>
      <select id="zoom-select" class="zoom-select">
        <option value="fit-width">Vừa chiều rộng</option>
        <option value="fit-page">Vừa trang</option>
        <option value="0.75">75%</option>
        <option value="1.0" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2.0">200%</option>
      </select>
      <button class="tool-btn hide-sm" id="btn-zoom-in" title="Phóng to (+)">+</button>
      
      <button class="tool-btn hide-sm" id="btn-mode" title="Chuyển chế độ xem (Cuộn liên tục / Từng trang)">📜 Cuộn</button>
      <button class="tool-btn hide-sm" id="btn-rotate" title="Xoay 90°">⟳</button>
      <button class="tool-btn" id="btn-fullscreen" title="Toàn màn hình">⛶</button>
      <a id="btn-download" href="#" target="_blank" class="tool-btn primary" title="Tải PDF về máy">⬇ <span class="hide-sm">Tải về</span></a>
    </div>
  </header>

  <!-- Viewer Canvas Area -->
  <main id="viewer-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p id="loading-text" style="font-size:0.95rem; font-weight:500;">Đang chuẩn bị sách...</p>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <div id="error-overlay">
      <h3>⚠️ Không thể tải tài liệu trực tuyến</h3>
      <p id="error-desc">Không thể tải hoặc hiển thị file PDF. Vui lòng tải file trực tiếp để đọc bằng ứng dụng đọc PDF trên máy.</p>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="tool-btn primary" onclick="location.reload()">Thử lại ↻</button>
        <a id="error-download-btn" href="#" class="tool-btn" target="_blank">Tải file PDF về máy ⬇</a>
      </div>
    </div>

    <!-- Container where PDF pages will be injected -->
    <div id="pdf-pages-wrap" style="display:flex; flex-direction:column; align-items:center; width:100%;"></div>
  </main>
</div>

<!-- PDF.js Scripts with local fallback -->
<script src="/assets/pdfjs/pdf.min.js"></script>
<script>
if (typeof pdfjsLib === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>');
}
</script>
<script>
(function() {
  // Configure PDF.js Worker
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/pdfjs/pdf.worker.min.js';
  }

  // Handle iframes vs standalone tab
  const inIframe = window.self !== window.top;
  const navActionContainer = document.querySelector('.toolbar-group:first-child');
  if (navActionContainer) {
    if (inIframe) {
      const popoutBtn = document.createElement('a');
      popoutBtn.className = 'tool-btn hide-sm';
      popoutBtn.title = 'Mở trong tab mới (Toàn màn hình)';
      popoutBtn.innerHTML = '↗ <span class="hide-sm">Tab mới</span>';
      popoutBtn.target = '_blank';
      popoutBtn.href = window.location.href;
      navActionContainer.prepend(popoutBtn);
    } else {
      const backBtn = document.createElement('a');
      backBtn.className = 'tool-btn';
      backBtn.title = 'Quay lại Thư viện sách';
      backBtn.innerHTML = '← <span class="hide-sm">Thư viện</span>';
      backBtn.href = '/books/';
      navActionContainer.prepend(backBtn);
    }
  }

  // Parse URL Parameters
  const params = new URLSearchParams(window.location.search);
  let pdfUrl = params.get('file') || params.get('pdf') || params.get('url');
  const customTitle = params.get('title');
  let initialPage = parseInt(params.get('page'), 10) || 1;

  // Fallback default test book if none specified
  if (!pdfUrl) {
    pdfUrl = 'https://raw.githubusercontent.com/taichikb/taichinow-media/main/assets/books/pdfs/fundamentals-of-pa-kua-chang-vol-1-by-park-bok-nam-in-dan-miller.pdf';
  }

  // Handle hash fragment in pdfUrl (e.g. #toolbar=1&page=5)
  if (pdfUrl.includes('#')) {
    const parts = pdfUrl.split('#');
    pdfUrl = parts[0];
    const hash = parts[1] || '';
    const pageMatch = hash.match(/page=(\d+)/i);
    if (pageMatch && !params.get('page')) {
      initialPage = parseInt(pageMatch[1], 10);
    }
  }

  // Set document title
  let displayTitle = customTitle;
  if (!displayTitle) {
    const slug = pdfUrl.split('/').pop().replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
    displayTitle = slug.charAt(0).toUpperCase() + slug.slice(1);
  }
  document.title = displayTitle + ' — TaichiKB Reader';
  document.getElementById('title-text').textContent = displayTitle;

  // Set download button href
  const btnDownload = document.getElementById('btn-download');
  const errorDownloadBtn = document.getElementById('error-download-btn');
  btnDownload.href = pdfUrl;
  btnDownload.setAttribute('download', pdfUrl.split('/').pop());
  errorDownloadBtn.href = pdfUrl;

  // UI Element References
  const viewerContainer = document.getElementById('viewer-container');
  const pagesWrap = document.getElementById('pdf-pages-wrap');
  const loadingOverlay = document.getElementById('loading-overlay');
  const progressBar = document.getElementById('progress-bar');
  const loadingText = document.getElementById('loading-text');
  const errorOverlay = document.getElementById('error-overlay');
  const errorDesc = document.getElementById('error-desc');
  const pageNumInput = document.getElementById('page-num');
  const pageCountSpan = document.getElementById('page-count');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const zoomSelect = document.getElementById('zoom-select');
  const btnZoomIn = document.getElementById('btn-zoom-in');
  const btnZoomOut = document.getElementById('btn-zoom-out');
  const btnMode = document.getElementById('btn-mode');
  const btnRotate = document.getElementById('btn-rotate');
  const btnFullscreen = document.getElementById('btn-fullscreen');

  // Viewer State
  let pdfDoc = null;
  let totalPages = 0;
  let currentPage = initialPage;
  let currentScale = 1.0;
  let zoomMode = 'fit-width'; // 'fit-width', 'fit-page', or 'custom'
  let viewMode = 'continuous'; // 'continuous' or 'single'
  // User-controlled rotation OFFSET (0, 90, 180, 270), added on top of each page's own
  // /Rotate. PDF.js getViewport({rotation}) REPLACES the page's /Rotate when passed
  // explicitly, so we must always pass (page.rotate + rotation) — otherwise scanned
  // pages that rely on /Rotate 180 render upside down.
  let rotation = 0;
  let pageRendering = {};
  let renderedPages = new Set();
  let pageElements = [];
  let observer = null;

  // Initialize IntersectionObserver for lazy rendering in continuous mode
  function initObserver() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const pageIdx = parseInt(entry.target.dataset.pageNumber, 10);
        if (entry.isIntersecting) {
          renderPage(pageIdx);
          currentPage = pageIdx;
          pageNumInput.value = currentPage;
          updateNavButtons();
        }
      });
    }, {
      root: viewerContainer,
      rootMargin: '600px 0px 600px 0px',
      threshold: [0.01, 0.5]
    });

    pageElements.forEach(card => observer.observe(card));
  }

  // Load the PDF Document
  function loadDocument() {
    if (!window.pdfjsLib) {
      showError('Không thể nạp thư viện PDF.js.');
      return;
    }

    loadingText.textContent = 'Đang kết nối thư viện tài liệu...';
    progressBar.style.width = '20%';

    const loadingTask = pdfjsLib.getDocument({
      url: pdfUrl,
      cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
      cMapPacked: true,
      enableXfa: true
    });

    loadingTask.onProgress = function(progress) {
      if (progress.total > 0) {
        const percent = Math.min(95, Math.round((progress.loaded / progress.total) * 100));
        progressBar.style.width = percent + '%';
        loadingText.textContent = `Đang tải sách (${percent}%)...`;
      }
    };

    loadingTask.promise.then(function(doc) {
      pdfDoc = doc;
      totalPages = doc.numPages;
      pageCountSpan.textContent = totalPages;
      pageNumInput.max = totalPages;

      progressBar.style.width = '100%';
      loadingText.textContent = 'Đang hiển thị...';

      // Setup page cards
      buildPagePlaceholders().then(() => {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 250);
        
        if (viewMode === 'continuous') {
          initObserver();
          if (currentPage > 1) {
            scrollToPage(currentPage);
          } else {
            renderPage(1);
          }
        } else {
          renderSinglePage(currentPage);
        }
      });
    }).catch(function(err) {
      console.error('PDF load error:', err);
      showError('Lỗi khi tải file PDF: ' + (err.message || 'Không thể truy cập tệp.'));
    });
  }

  // Build card placeholders for all pages
  async function buildPagePlaceholders() {
    pagesWrap.innerHTML = '';
    pageElements = [];
    renderedPages.clear();

    const firstPage = await pdfDoc.getPage(1);
    const viewport = firstPage.getViewport({ scale: 1.0, rotation: rotation + (firstPage.rotate || 0) });
    calculateScale(viewport);

    for (let i = 1; i <= totalPages; i++) {
      const card = document.createElement('div');
      card.className = 'pdf-page-card';
      card.dataset.pageNumber = i;
      card.id = `page-card-${i}`;

      const cardWidth = Math.floor(viewport.width * currentScale);
      const cardHeight = Math.floor(viewport.height * currentScale);
      card.style.width = cardWidth + 'px';
      card.style.height = cardHeight + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'page-placeholder';
      placeholder.style.width = '100%';
      placeholder.style.height = '100%';
      placeholder.textContent = `Trang ${i} / ${totalPages}`;
      card.appendChild(placeholder);

      const badge = document.createElement('div');
      badge.className = 'page-badge';
      badge.textContent = `${i} / ${totalPages}`;
      card.appendChild(badge);

      pagesWrap.appendChild(card);
      pageElements.push(card);
    }
  }

  // Calculate Scale based on Mode
  function calculateScale(viewport) {
    const containerWidth = Math.max(300, viewerContainer.clientWidth - 40);
    const containerHeight = Math.max(400, viewerContainer.clientHeight - 60);

    if (zoomMode === 'fit-width') {
      currentScale = containerWidth / viewport.width;
    } else if (zoomMode === 'fit-page') {
      const scaleW = containerWidth / viewport.width;
      const scaleH = containerHeight / viewport.height;
      currentScale = Math.min(scaleW, scaleH);
    }
  }

  // Render a specific page onto its card
  async function renderPage(pageNum) {
    if (renderedPages.has(pageNum) || pageRendering[pageNum]) return;
    if (pageNum < 1 || pageNum > totalPages) return;

    pageRendering[pageNum] = true;
    const card = document.getElementById(`page-card-${pageNum}`);
    if (!card) return;

    try {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: currentScale, rotation: rotation + (page.rotate || 0) });

      const dpr = window.devicePixelRatio || 1;
      card.style.width = Math.floor(viewport.width) + 'px';
      card.style.height = Math.floor(viewport.height) + 'px';

      let canvas = card.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        const placeholder = card.querySelector('.page-placeholder');
        if (placeholder) placeholder.remove();
        card.insertBefore(canvas, card.firstChild);
      }

      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      await page.render(renderContext).promise;
      renderedPages.add(pageNum);
    } catch (e) {
      console.warn(`Error rendering page ${pageNum}:`, e);
    } finally {
      delete pageRendering[pageNum];
    }
  }

  // Single page rendering
  async function renderSinglePage(pageNum) {
    pagesWrap.innerHTML = '';
    renderedPages.clear();

    const page = await pdfDoc.getPage(pageNum);
    const viewport1 = page.getViewport({ scale: 1.0, rotation: rotation + (page.rotate || 0) });
    calculateScale(viewport1);
    const viewport = page.getViewport({ scale: currentScale, rotation: rotation + (page.rotate || 0) });

    const card = document.createElement('div');
    card.className = 'pdf-page-card';
    card.style.width = Math.floor(viewport.width) + 'px';
    card.style.height = Math.floor(viewport.height) + 'px';

    const dpr = window.devicePixelRatio || 1;
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    card.appendChild(canvas);

    const badge = document.createElement('div');
    badge.className = 'page-badge';
    badge.textContent = `Trang ${pageNum} / ${totalPages}`;
    card.appendChild(badge);

    pagesWrap.appendChild(card);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    currentPage = pageNum;
    pageNumInput.value = currentPage;
    updateNavButtons();
  }

  // Scroll to page in continuous mode
  function scrollToPage(pageNum) {
    if (pageNum < 1 || pageNum > totalPages) return;
    currentPage = pageNum;
    pageNumInput.value = pageNum;
    updateNavButtons();

    if (viewMode === 'continuous') {
      const card = document.getElementById(`page-card-${pageNum}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        renderPage(pageNum);
      }
    } else {
      renderSinglePage(pageNum);
    }
  }

  // Navigation Button Updates
  function updateNavButtons() {
    btnPrev.disabled = currentPage <= 1;
    btnNext.disabled = currentPage >= totalPages;
  }

  // Re-render when Zoom or Rotation changes
  function applyZoom() {
    if (!pdfDoc) return;
    if (viewMode === 'continuous') {
      buildPagePlaceholders().then(() => {
        initObserver();
        scrollToPage(currentPage);
      });
    } else {
      renderSinglePage(currentPage);
    }
  }

  // Show Error Screen
  function showError(msg) {
    loadingOverlay.style.display = 'none';
    errorOverlay.style.display = 'flex';
    errorDesc.textContent = msg;
  }

  // Event Listeners
  btnPrev.addEventListener('click', () => scrollToPage(currentPage - 1));
  btnNext.addEventListener('click', () => scrollToPage(currentPage + 1));

  pageNumInput.addEventListener('change', () => {
    let p = parseInt(pageNumInput.value, 10);
    if (isNaN(p)) p = 1;
    p = Math.max(1, Math.min(totalPages, p));
    scrollToPage(p);
  });

  zoomSelect.addEventListener('change', () => {
    const val = zoomSelect.value;
    if (val === 'fit-width' || val === 'fit-page') {
      zoomMode = val;
    } else {
      zoomMode = 'custom';
      currentScale = parseFloat(val);
    }
    applyZoom();
  });

  btnZoomIn.addEventListener('click', () => {
    zoomMode = 'custom';
    currentScale = Math.min(3.0, currentScale + 0.2);
    zoomSelect.value = currentScale.toFixed(2);
    applyZoom();
  });

  btnZoomOut.addEventListener('click', () => {
    zoomMode = 'custom';
    currentScale = Math.max(0.4, currentScale - 0.2);
    zoomSelect.value = currentScale.toFixed(2);
    applyZoom();
  });

  btnMode.addEventListener('click', () => {
    if (viewMode === 'continuous') {
      viewMode = 'single';
      btnMode.textContent = '📄 Từng trang';
      btnMode.title = 'Đang ở chế độ Từng trang. Nhấn để chuyển sang Cuộn liên tục.';
      if (observer) observer.disconnect();
      renderSinglePage(currentPage);
    } else {
      viewMode = 'continuous';
      btnMode.textContent = '📜 Cuộn';
      btnMode.title = 'Đang ở chế độ Cuộn liên tục. Nhấn để chuyển sang Từng trang.';
      buildPagePlaceholders().then(() => {
        initObserver();
        scrollToPage(currentPage);
      });
    }
  });

  btnRotate.addEventListener('click', () => {
    rotation = (rotation + 90) % 360;
    applyZoom();
  });

  btnFullscreen.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      btnFullscreen.textContent = '⛶ Thoát';
    } else {
      document.exitFullscreen().catch(() => {});
      btnFullscreen.textContent = '⛶';
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      btnFullscreen.textContent = '⛶';
    }
  });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      scrollToPage(currentPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      scrollToPage(currentPage - 1);
    } else if (e.key === 'Home') {
      scrollToPage(1);
    } else if (e.key === 'End') {
      scrollToPage(totalPages);
    } else if (e.key === '+' || e.key === '=') {
      btnZoomIn.click();
    } else if (e.key === '-') {
      btnZoomOut.click();
    } else if (e.key === 'f' || e.key === 'F') {
      btnFullscreen.click();
    }
  });

  // Handle Window Resize (recalculate fit-width / fit-page)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (zoomMode === 'fit-width' || zoomMode === 'fit-page') {
        applyZoom();
      }
    }, 200);
  });

  // Support postMessage from parent window (e.g. jumpToPage)
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.action === 'jumpToPage' && typeof e.data.page === 'number') {
      scrollToPage(e.data.page);
    }
  });

  // Start Loading Document
  loadDocument();
})();
</script>
</body>
</html>
