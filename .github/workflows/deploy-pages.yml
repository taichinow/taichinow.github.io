name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------------
      # Stage a slimmed copy of the tree instead of uploading everything.
      #
      # GitHub Pages rejects artifacts over 1 GB and this tree is ~8.5 GB, so the
      # large media directories are excluded and served from taichikb/taichinow-media
      # instead, via absolute raw.githubusercontent.com URLs (same bytes, sent with
      # Access-Control-Allow-Origin: *):
      #
      #   books/pdfs          ~4.83 GB  offloaded; reader pages use absolute URLs
      #   assets/books        ~2.14 GB  offloaded; 99 pages rewritten to absolute
      #   assets/images/books ~0.87 GB  offloaded; same rewrite
      #   assets/pdf          ~0.00 GB  offloaded
      #   downloads           ~0.02 GB  referenced by nothing
      #
      # This is the same exclusion list taichikb uses, so both sites now serve one
      # corpus one way. Staged artifact: ~825 MB / 4,284 files.
      #
      # Before adding a tree here, check that nothing still points at it relatively:
      # raw URLs render images fine, but PDFs must go through /pdf-viewer/?file=…,
      # because raw.githubusercontent serves them as application/octet-stream and
      # browsers will not render that inline.
      #
      # NOTE: tar is used rather than rsync, which is not guaranteed on the
      # runner, and _site itself must be excluded so the tar does not read the
      # directory it is filling.
      # ---------------------------------------------------------------------------
      - name: Stage site (exclude offloaded media)
        run: |
          set -eu
          mkdir -p _site
          : > /tmp/exclude.txt
          printf '%s\n' "./.git" "./.github" "./_site" >> /tmp/exclude.txt
          printf '%s\n' "./assets/books" "./assets/images/books" "./assets/pdf" "./books/pdfs" "./downloads" >> /tmp/exclude.txt
          echo "Exclusion entries: $(wc -l < /tmp/exclude.txt)"
          tar --exclude-from=/tmp/exclude.txt -cf - . | tar -xf - -C _site
          SIZE_MB=$(du -sm _site | cut -f1)
          echo "Staged artifact size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 900 ]; then
            echo "::warning::Staged artifact is ${SIZE_MB} MB — closing on the 1 GB Pages limit. Check what grew."
          fi
          if [ "$SIZE_MB" -gt 1024 ]; then
            echo "::error::Staged artifact is ${SIZE_MB} MB — over the 1 GB Pages limit; the upload will be rejected." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
