  .inline-image { max-width: 100%; height: auto; display: block; margin: 1em auto; border-radius: 4px; }
  .dark-toggle { background: #1e293b; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }

  }
</style>
